spring.application.name=urbanova

spring.datasource.url=jdbc:mysql://47.109.73.119:3306/urbanova?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.localhost=${MAIL_SMTP_LOCALHOST:localhost}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

app.mail.from-address=${MAIL_FROM:${spring.mail.username:}}
app.mail.oauth2.enabled=${MAIL_OAUTH2_ENABLED:false}
app.mail.oauth2.provider=${MAIL_OAUTH2_PROVIDER:outlook}
app.mail.oauth2.tenant=${MAIL_OAUTH2_TENANT:consumers}
app.mail.oauth2.client-id=${MAIL_OAUTH2_CLIENT_ID:}
app.mail.oauth2.client-secret=${MAIL_OAUTH2_CLIENT_SECRET:}
app.mail.oauth2.refresh-token=${MAIL_OAUTH2_REFRESH_TOKEN:}
app.mail.oauth2.scope=${MAIL_OAUTH2_SCOPE:https://outlook.office.com/SMTP.Send offline_access}
app.mail.oauth2.token-uri=${MAIL_OAUTH2_TOKEN_URI:}
app.mail.oauth2.transport=${MAIL_OAUTH2_TRANSPORT:smtp}
app.mail.graph.send-mail-url=${MAIL_GRAPH_SEND_MAIL_URL:https://graph.microsoft.com/v1.0/me/sendMail}
app.mail.graph.save-to-sent-items=${MAIL_GRAPH_SAVE_TO_SENT_ITEMS:true}
app.auth.email-verification-expiration-minutes=${APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
app.auth.email-verification-resend-cooldown-seconds=${APP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.auth.password-reset-expiration-minutes=${APP_PASSWORD_RESET_EXPIRATION_MINUTES:10}
app.auth.password-reset-resend-cooldown-seconds=${APP_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
app.storage.issue-photos-dir=${APP_ISSUE_PHOTO_STORAGE_DIR:storage/issues}

# MyBatis-Plus éç½®
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.lcyhz.urbanova.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

logging.level.com.lcyhz=DEBUG
